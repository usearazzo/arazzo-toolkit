name: Release monorepo packages
on:
  workflow_dispatch:

env:
  CPU_CORES: 2
  HUSKY: 0

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/org/usearazzo
    permissions:
      contents: write
      id-token: write

    # the runner's publishing gate: its e2e suite runs against a live petstore
    services:
      petstore:
        image: swaggerapi/petstore3:1.0.28
        ports:
          - 8080:8080
        # the image ships wget but not curl
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8080/api/v3/openapi.json"
          --health-interval 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          registry-url: https://registry.npmjs.org
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build monorepo
        run: npm run build
      - name: Check TypeScript types
        run: npm run typescript:check-types
      - name: Execute tests in monorepo
        run: npm run test
      - name: Execute runner end-to-end tests against the petstore
        run: npm run test:e2e
        working-directory: ./packages/runner
        env:
          PETSTORE_URL: http://localhost:8080/api/v3
      - name: Version bump & GitHub release
        run: |
          git config user.name  "Vladimir Gorej"
          git config user.email "vladimir.gorej@gmail.com"
          npx lerna version prerelease --preid alpha --no-private --yes --force-publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Mark release as latest
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          gh release edit "v${VERSION}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Publish monorepo npm packages
        run: npx lerna publish from-package --no-private --yes
