# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Arazzo Toolkit Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CPU_CORES: 2

jobs:
  lint-commit-messages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necessary for linting commit messages
          ref: ${{ github.event.pull_request.head.sha }} # necessary to check out pull request HEAD commit instead of merge commit
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint commit message
        if: github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Generate typescript declarations
        run: npm run typescript:declaration
        working-directory: ./packages/parser
      - name: Lint code
        run: npm run lint

  check-typescript-types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Generate typescript declarations
        run: npm run typescript:declaration
      - name: Check TypeScript types
        run: npm run typescript:check-types

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build monorepo for testing
        run: npm run build:es
      - name: Execute tests in monorepo
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      petstore:
        # keep the image in sync with release.yml and packages/runner/test/e2e/container.ts
        image: swaggerapi/petstore3:1.0.28
        ports:
          - 8080:8080
        # the image ships wget but not curl
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8080/api/v3/openapi.json"
          --health-interval 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.3.1
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build monorepo for testing
        run: npm run build:es
      - name: Execute end-to-end tests against the petstore
        run: npm run test:e2e
        working-directory: ./packages/runner
        env:
          PETSTORE_URL: http://localhost:8080/api/v3

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.3.1
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
    - name: Install dependencies
      run: npm ci
    - name: Build monorepo
      run: npm run build:es
