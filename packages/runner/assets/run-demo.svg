  <circle cx="20" cy="18" r="5.5" fill="#FF5F56"/><circle cx="38" cy="18" r="5.5" fill="#FFBD2E"/><circle cx="56" cy="18" r="5.5" fill="#27C93F"/>
  <text x="74" y="22" fill="#9CA3AF" font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="12">@usearazzo/runner</text>
  <g font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="14" xml:space="preserve">
  <g class="s0" opacity="0">
    <g class="a0">
      <text x="22.0" y="70" fill="#AEB6C2">$</text><text x="38.9" y="70" fill="#A3D977">docker run --rm -d -p 8080:8080 swaggerapi/petstore3:1.0.28</text>
      <g class="t0" transform="translate(497.4 0)"><rect x="38.9" y="54" width="972" height="22" fill="#1F2937"/></g>
      <g class="o0"><text x="22.0" y="92" fill="#AEB6C2">c0e5624dc0fcd9f2dff83a25996174e9a0d764b4029abfc315842f968fa71e82</text></g>
    </g>
    <g class="a1">
      <text x="22.0" y="114" fill="#AEB6C2">$</text><text x="38.9" y="114" fill="#A3D977">node</text>
      <g class="t1" transform="translate(33.7 0)"><rect x="38.9" y="98" width="972" height="22" fill="#1F2937"/></g>
      <g class="o1"><text x="22.0" y="136" fill="#AEB6C2">Welcome to Node.js v24.10.0.</text><text x="22.0" y="158" fill="#AEB6C2">Type ".help" for more information.</text></g>
    </g>
    <g class="a2">
      <text x="22.0" y="180" fill="#A3D977">&gt;</text><text x="38.9" y="180" fill="#E5E7EB">const runner = await import('@usearazzo/runner')</text>
      <g class="t2" transform="translate(404.6 0)"><rect x="38.9" y="164" width="972" height="22" fill="#1F2937"/></g>
      <g class="o2"><text x="22.0" y="202" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a3">
      <text x="22.0" y="224" fill="#A3D977">&gt;</text><text x="38.9" y="224" fill="#E5E7EB">const url = 'https://usearazzo.com/assets/reference/runner/petstore-order.arazzo.yaml'</text>
      <g class="t3" transform="translate(725.0 0)"><rect x="38.9" y="208" width="972" height="22" fill="#1F2937"/></g>
      <g class="o3"><text x="22.0" y="246" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a4">
      <text x="22.0" y="268" fill="#A3D977">&gt;</text><text x="38.9" y="268" fill="#E5E7EB">const registry = new runner.DocumentRegistry()</text>
      <g class="t4" transform="translate(387.8 0)"><rect x="38.9" y="252" width="972" height="22" fill="#1F2937"/></g>
      <g class="o4"><text x="22.0" y="290" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a5">
      <text x="22.0" y="312" fill="#A3D977">&gt;</text><text x="38.9" y="312" fill="#E5E7EB">const document = await registry.acquireEntryDocument(url)</text>
      <g class="t5" transform="translate(480.5 0)"><rect x="38.9" y="296" width="972" height="22" fill="#1F2937"/></g>
      <g class="o5"><text x="22.0" y="334" fill="#AEB6C2">undefined</text></g>
    </g>
  </g>
  <g class="s1" opacity="0">
    <g class="a6">
      <text x="22.0" y="70" fill="#A3D977">&gt;</text><text x="38.9" y="70" fill="#E5E7EB">const operationExecutor = new runner.OpenAPIOperationExecutor()</text>
      <g class="t6" transform="translate(531.1 0)"><rect x="38.9" y="54" width="972" height="22" fill="#1F2937"/></g>
      <g class="o6"><text x="22.0" y="92" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a7">
      <text x="22.0" y="114" fill="#A3D977">&gt;</text><text x="38.9" y="114" fill="#E5E7EB">const stepExecutor = new runner.StepExecutor({ document, registry, operationExecutor })</text>
      <g class="t7" transform="translate(733.4 0)"><rect x="38.9" y="98" width="972" height="22" fill="#1F2937"/></g>
      <g class="o7"><text x="22.0" y="136" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a8">
      <text x="22.0" y="158" fill="#A3D977">&gt;</text><text x="38.9" y="158" fill="#E5E7EB">const executor = new runner.WorkflowExecutor({ document, registry, stepExecutor })</text>
      <g class="t8" transform="translate(691.3 0)"><rect x="38.9" y="142" width="972" height="22" fill="#1F2937"/></g>
      <g class="o8"><text x="22.0" y="180" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a9">
      <text x="22.0" y="202" fill="#A3D977">&gt;</text><text x="38.9" y="202" fill="#E5E7EB">const inputs = { username: 'theUser', password: '12345', preferredPetStatus: 'available', orderQuantity: 1 }</text>
      <g class="t9" transform="translate(910.4 0)"><rect x="38.9" y="186" width="972" height="22" fill="#1F2937"/></g>
      <g class="o9"><text x="22.0" y="224" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a10">
      <text x="22.0" y="246" fill="#A3D977">&gt;</text><text x="38.9" y="246" fill="#E5E7EB">const options = { inputs, executeOptions: { server: 'http://localhost:8080/api/v3' } }</text>
      <g class="t10" transform="translate(725.0 0)"><rect x="38.9" y="230" width="972" height="22" fill="#1F2937"/></g>
      <g class="o10"><text x="22.0" y="268" fill="#AEB6C2">undefined</text></g>
    </g>
  </g>
  <g class="s2">
    <g class="a11">
      <text x="22.0" y="70" fill="#A3D977">&gt;</text><text x="38.9" y="70" fill="#E5E7EB">const result = await executor.execute('authenticateAndOrderPet', options)</text>
      <g class="t11" transform="translate(615.4 0)"><rect x="38.9" y="54" width="972" height="22" fill="#1F2937"/></g>
      <g class="o11"><text x="22.0" y="92" fill="#AEB6C2">undefined</text></g>
    </g>
    <g class="a12">
      <text x="22.0" y="114" fill="#A3D977">&gt;</text><text x="38.9" y="114" fill="#E5E7EB">result.status</text>
      <g class="t12" transform="translate(109.6 0)"><rect x="38.9" y="98" width="972" height="22" fill="#1F2937"/></g>
      <g class="o12"><text x="22.0" y="136" fill="#A3D977">'completed'</text></g>
    </g>
    <g class="a13">
      <text x="22.0" y="158" fill="#A3D977">&gt;</text><text x="38.9" y="158" fill="#E5E7EB">result.steps.map((s) =&gt; `${s.successful ? '✓' : '✗'} ${s.stepId}`)</text>
      <g class="t13" transform="translate(556.4 0)"><rect x="38.9" y="142" width="972" height="22" fill="#1F2937"/></g>
      <g class="o13"><text x="22.0" y="180" fill="#A3D977">[</text><text x="38.9" y="202" fill="#A3D977">'✓ loginUser',</text><text x="38.9" y="224" fill="#A3D977">'✓ findAvailablePets',</text><text x="38.9" y="246" fill="#A3D977">'✓ placeOrder',</text><text x="38.9" y="268" fill="#A3D977">'✓ retrieveOrderedPetDetails',</text><text x="38.9" y="290" fill="#A3D977">'✓ verifyOrderConfirmation'</text><text x="22.0" y="312" fill="#A3D977">]</text></g>
    </g>
  </g>
  </g>
