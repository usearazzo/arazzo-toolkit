  <circle cx="20" cy="18" r="5.5" fill="#FF5F56"/><circle cx="38" cy="18" r="5.5" fill="#FFBD2E"/><circle cx="56" cy="18" r="5.5" fill="#27C93F"/>
  <text x="74" y="22" fill="#9CA3AF" font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="12">@usearazzo/runner</text>
  <g clip-path="url(#screen)">
  <g class="scroll" transform="translate(0 -286)" font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="14" xml:space="preserve">
    <g class="l0"><text x="22.0" y="70" fill="#AEB6C2">$</text><text x="38.9" y="70" fill="#A3D977">docker run --rm -d -p 8080:8080 swaggerapi/petstore3:1.0.28</text><g class="t0" transform="translate(497.4 0)"><rect x="38.9" y="54" width="921" height="22" fill="#1F2937"/></g></g>
    <g class="l1"><text x="22.0" y="92" fill="#AEB6C2">4d570a52c1bcdb87286e5ceed5177b033cf54d1de70c5279b6db33a4f40f0f1c</text></g>
    <g class="l2"><text x="22.0" y="114" fill="#AEB6C2">$</text><text x="38.9" y="114" fill="#A3D977">node</text><g class="t2" transform="translate(33.7 0)"><rect x="38.9" y="98" width="921" height="22" fill="#1F2937"/></g></g>
    <g class="l3"><text x="22.0" y="136" fill="#AEB6C2">Welcome to Node.js v24.10.0.</text></g>
    <g class="l4"><text x="22.0" y="158" fill="#AEB6C2">Type ".help" for more information.</text></g>
    <g class="l5"><text x="22.0" y="180" fill="#A3D977">&gt;</text><text x="38.9" y="180" fill="#E5E7EB">.editor</text><g class="t5" transform="translate(59.0 0)"><rect x="38.9" y="164" width="921" height="22" fill="#1F2937"/></g></g>
    <g class="l6"><text x="22.0" y="202" fill="#AEB6C2">// Entering editor mode (Ctrl+D to finish, Ctrl+C to cancel)</text></g>
    <g class="l7"><text x="22.0" y="224" fill="#E5E7EB">const { DocumentRegistry, OpenAPIOperationExecutor, StepExecutor, WorkflowExecutor } =</text></g>
    <g class="l8"><text x="38.9" y="246" fill="#E5E7EB">await import('@usearazzo/runner');</text></g>
    <g class="l9"></g>
    <g class="l10"><text x="22.0" y="290" fill="#E5E7EB">const registry = new DocumentRegistry();</text></g>
    <g class="l11"><text x="22.0" y="312" fill="#E5E7EB">const document = await registry.acquireEntryDocument(</text></g>
    <g class="l12"><text x="38.9" y="334" fill="#E5E7EB">'https://usearazzo.com/assets/reference/runner/petstore-order.arazzo.yaml',</text></g>
    <g class="l13"><text x="22.0" y="356" fill="#E5E7EB">);</text></g>
    <g class="l14"><text x="22.0" y="378" fill="#E5E7EB">const operationExecutor = new OpenAPIOperationExecutor();</text></g>
    <g class="l15"><text x="22.0" y="400" fill="#E5E7EB">const stepExecutor = new StepExecutor({ document, registry, operationExecutor });</text></g>
    <g class="l16"><text x="22.0" y="422" fill="#E5E7EB">const executor = new WorkflowExecutor({ document, registry, stepExecutor });</text></g>
    <g class="l17"></g>
    <g class="l18"><text x="22.0" y="466" fill="#E5E7EB">const result = await executor.execute('authenticateAndOrderPet', {</text></g>
    <g class="l19"><text x="38.9" y="488" fill="#E5E7EB">inputs: { username: 'theUser', password: '12345', preferredPetStatus: 'available', orderQuantity: 1 },</text></g>
    <g class="l20"><text x="38.9" y="510" fill="#E5E7EB">executeOptions: { server: 'http://localhost:8080/api/v3' },</text></g>
    <g class="l21"><text x="22.0" y="532" fill="#E5E7EB">});</text></g>
    <g class="l22"><text x="22.0" y="554" fill="#E5E7EB">result.steps.map((s) =&gt; `${s.successful ? '✓' : '✗'} ${s.stepId}`);</text></g>
    <g class="l23"></g>
    <g class="l24"><text x="22.0" y="598" fill="#A3D977">[</text></g>
    <g class="l25"><text x="38.9" y="620" fill="#A3D977">'✓ loginUser',</text></g>
    <g class="l26"><text x="38.9" y="642" fill="#A3D977">'✓ findAvailablePets',</text></g>
    <g class="l27"><text x="38.9" y="664" fill="#A3D977">'✓ placeOrder',</text></g>
    <g class="l28"><text x="38.9" y="686" fill="#A3D977">'✓ retrieveOrderedPetDetails',</text></g>
    <g class="l29"><text x="38.9" y="708" fill="#A3D977">'✓ verifyOrderConfirmation'</text></g>
    <g class="l30"><text x="22.0" y="730" fill="#A3D977">]</text></g>
    <g class="l31"><text x="22.0" y="752" fill="#A3D977">&gt;</text><text x="38.9" y="752" fill="#E5E7EB">result.status</text><g class="t31" transform="translate(109.6 0)"><rect x="38.9" y="736" width="921" height="22" fill="#1F2937"/></g></g>
    <g class="l32"><text x="22.0" y="774" fill="#A3D977">'completed'</text></g>
  </g>
  </g>
