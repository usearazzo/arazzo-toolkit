arazzo: "1.0.1"
info:
  title: Control-flow test workflows
  version: "1.0.0"
  summary: >-
    Minimal workflows exercising WorkflowExecutor control flow (linear, goto,
    end, break, and the not-yet-supported actions) against the petstore API.
sourceDescriptions:
  - name: petstoreAPI
    url: ./petstore.openapi.json
    type: openapi
workflows:
  # steps run in order; a later step reads an earlier step's output, and the
  # workflow outputs resolve against the final state.
  - workflowId: linear
    inputs:
      type: object
      properties:
        status:
          type: string
    steps:
      - stepId: findPets
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: $inputs.status
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petId: $response.body#/id
      - stepId: getPet
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: $steps.findPets.outputs.petId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body#/name
    outputs:
      name: $steps.getPet.outputs.petName
      id: $steps.findPets.outputs.petId

  # the first step's onSuccess goto jumps over the second step to the third.
  - workflowId: gotoStep
    steps:
      - stepId: first
        operationId: getInventory
        onSuccess:
          - name: skipSecond
            type: goto
            stepId: third
      - stepId: second
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode
      - stepId: third
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"
        outputs:
          reached: $statusCode
    outputs:
      secondRan: $steps.second.outputs.ran
      thirdReached: $steps.third.outputs.reached

  # the first step's onSuccess end stops the run before the second step.
  - workflowId: endEarly
    steps:
      - stepId: first
        operationId: getInventory
        outputs:
          firstStatus: $statusCode
        onSuccess:
          - name: stop
            type: end
      - stepId: second
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          secondStatus: $statusCode
    outputs:
      first: $steps.first.outputs.firstStatus
      second: $steps.second.outputs.secondStatus

  # the first step fails its successCriteria with no onFailure, so the run
  # breaks and the second step never executes.
  - workflowId: failBreak
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
      - stepId: never
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode
    outputs:
      neverRan: $steps.never.outputs.ran

  # the only step gotos itself forever — bounded by the step budget.
  - workflowId: infiniteGoto
    steps:
      - stepId: loop
        operationId: getInventory
        onSuccess:
          - name: again
            type: goto
            stepId: loop

  # goto targets a step that does not exist in this workflow.
  - workflowId: gotoMissing
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: bad
            type: goto
            stepId: nonexistent

  # the transfer target used below: two steps whose outputs the caller's
  # `transferredTo` exposes, and an `inputs` declaration read by neither
  # operation's own parameters (both are hardcoded) but by a step output —
  # proving a goto's transfer always runs its target with {} inputs (issue
  # #62, the same gap a retry's workflowId reference has). Deliberately
  # avoids reading `$inputs` through an OpenAPI operation *parameter*: the
  # stub transport skips request validation, but the real OpenAPI request
  # builder underneath does not, and a required parameter left unresolved
  # would fail there rather than demonstrate the gap.
  - workflowId: transferTarget
    inputs:
      type: object
      properties:
        status:
          type: string
    steps:
      - stepId: first
        operationId: getInventory
        outputs:
          echoedStatus: $inputs.status
      - stepId: second
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body#/name
    outputs:
      name: $steps.second.outputs.petName
      echoedStatus: $steps.first.outputs.echoedStatus

  # goto targets a workflowId — a one-way transfer. `only`'s own outputs and
  # this workflow's own `outputs` declaration prove the caller's outputs are
  # never evaluated: the run ends at the transfer, not at its own end.
  - workflowId: transfersToTarget
    outputs:
      neverEvaluated: $steps.only.outputs.ran
    steps:
      - stepId: only
        operationId: getInventory
        outputs:
          ran: $statusCode
        onSuccess:
          - name: jump
            type: goto
            workflowId: transferTarget

  # a transfer chain: start transfers to middle, which transfers to the
  # target — `transferredTo.transferredTo` must recurse to its completed
  # result.
  - workflowId: transferChainStart
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: transferChainMiddle
  - workflowId: transferChainMiddle
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: transferTarget

  # the step fails its successCriteria, and the failure-path action (not the
  # success default) is the transfer — a transfer can fire from either path.
  - workflowId: transferOnFailure
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: jump
            type: goto
            workflowId: emptyWorkflow

  # transfers to a workflow whose own chain settles 'failed' — the top-level
  # result is 'transferred', not 'failed'; a caller checking the settled
  # status via the exported `settledResult` sees the real outcome.
  - workflowId: transfersToFailing
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: failBreak

  # a goto naming both a stepId and a workflowId — mutually exclusive.
  - workflowId: gotoAmbiguous
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: bad
            type: goto
            stepId: only
            workflowId: linear

  # a goto's workflowId reference into another document — not yet supported.
  - workflowId: gotoCrossDocument
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: $sourceDescriptions.petstoreAPI.someWorkflow

  # a goto targets a workflowId this document does not define.
  - workflowId: gotoUnknownWorkflow
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: noSuchWorkflow

  # a goto transfer to a workflow with no steps of its own — entering it must
  # NOT be charged against the step budget, unlike a retry's workflowId
  # reference: a goto fires once per step evaluation, not repeatedly.
  - workflowId: transfersToEmpty
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            workflowId: emptyWorkflow

  # the step fails then succeeds within the retry budget: the operation is
  # re-run until a 200 arrives, and the run completes.
  - workflowId: retryThenSucceed
    steps:
      - stepId: flaky
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 3
            retryAfter: 2
        outputs:
          status: $statusCode
    outputs:
      status: $steps.flaky.outputs.status

  # after a retry finally succeeds, control proceeds to the following step — a
  # successful retry must not break the rest of the workflow.
  - workflowId: retryThenSucceedThenNext
    steps:
      - stepId: flaky
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 3
      - stepId: after
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode
    outputs:
      after: $steps.after.outputs.ran

  # retries are exhausted, then the SUBSEQUENT failure action (end) fires — per
  # spec, retryLimit must be exhausted prior to executing subsequent actions.
  - workflowId: retryExhaustedThenEnd
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 2
            retryAfter: 1
          - name: giveUp
            type: end
      - stepId: unreached
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available

  # retries are exhausted and there is no subsequent failure action, so the run
  # falls to the break-default (status: failed).
  - workflowId: retryExhaustedThenBreak
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 2

  # a retry with no retryLimit — defaults to a single retry (2 attempts total),
  # then the break-default.
  - workflowId: retryDefaultLimit
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry

  # two retry actions in the chain: the first exhausts its own budget, then the
  # second exhausts its independent budget, then the terminal end fires.
  - workflowId: retryChainIndependentBudgets
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: retryFast
            type: retry
            retryLimit: 2
            retryAfter: 1
          - name: retrySlow
            type: retry
            retryLimit: 3
            retryAfter: 5
          - name: giveUp
            type: end

  # after retries are exhausted, the subsequent failure action is a goto — the
  # exhausted retry falls through to it and jumps to a later step.
  - workflowId: retryExhaustedThenGoto
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 1
          - name: recover
            type: goto
            stepId: recovery
      - stepId: skipped
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode
      - stepId: recovery
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"
        outputs:
          reached: $statusCode
    outputs:
      skipped: $steps.skipped.outputs.ran
      recovery: $steps.recovery.outputs.reached

  # the retry's criteria match only a 503; the first attempt returns 503 (retry
  # fires), the second returns 500 (criteria no longer match) so the retry is not
  # re-selected and the run breaks — proving re-selection against the fresh
  # response, not the first.
  - workflowId: retryCriteriaStopMatching
    steps:
      - stepId: flaky
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: retryOn503
            type: retry
            retryLimit: 5
            criteria:
              - condition: $statusCode == 503

  # a retry action carrying a stepId reference to the step's own id — one more
  # attempt at "doomed" fires before each of its own retries.
  - workflowId: retryWithReference
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 2
            stepId: doomed

  # login re-runs (via the retry reference) between the failing call's
  # attempts, and its outputs — read by the workflow's own outputs — reflect
  # the reference's run, not the original one: proof "context transfers back".
  - workflowId: retryWithRepairStep
    steps:
      - stepId: login
        operationId: getInventory
        outputs:
          token: $response.body#/token
      - stepId: call
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: reLogin
            type: retry
            retryLimit: 2
            stepId: login
        outputs:
          status: $statusCode
    outputs:
      token: $steps.login.outputs.token
      status: $steps.call.outputs.status

  # the retry references a stepId this workflow does not declare.
  - workflowId: retryReferenceTargetMissing
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: badRef
            type: retry
            retryLimit: 2
            stepId: nonexistent

  # run to completion by a retry's workflowId reference, before the retried
  # step's own next attempt.
  - workflowId: repairFlow
    steps:
      - stepId: refresh
        operationId: getInventory
        outputs:
          refreshed: $statusCode
    outputs:
      refreshed: $steps.refresh.outputs.refreshed

  - workflowId: retryWithWorkflowReference
    steps:
      - stepId: call
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: repair
            type: retry
            retryLimit: 1
            workflowId: repairFlow
        outputs:
          status: $statusCode
    outputs:
      status: $steps.call.outputs.status
      repaired: $workflows.repairFlow.outputs.refreshed

  # a retry's workflowId reference into another document — not yet supported.
  - workflowId: retryReferenceCrossDocument
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: crossDoc
            type: retry
            retryLimit: 1
            workflowId: $sourceDescriptions.petstoreAPI.someWorkflow

  # a retry action naming both a stepId and a workflowId — mutually exclusive.
  - workflowId: retryAmbiguousReference
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: bad
            type: retry
            retryLimit: 1
            stepId: doomed
            workflowId: repairFlow

  # a retry's workflowId reference to a workflow with no steps of its own —
  # entering it must still be charged, proving it isn't a free ride.
  - workflowId: retryWithBudgetedWorkflowReference
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: repair
            type: retry
            retryLimit: 1
            workflowId: emptyWorkflow

  # a workflowId-targeting step's inputs must reflect a retry reference's
  # repair on the next attempt, not the state as it stood at the step's first
  # attempt — the repaired token only reaches the sub-workflow once its own
  # inputs stop being frozen.
  - workflowId: echoValue
    inputs:
      type: object
      properties:
        value:
          type: string
    steps:
      - stepId: echo
        operationId: getInventory
        outputs:
          echoed: $inputs.value
    outputs:
      echoed: $steps.echo.outputs.echoed

  - workflowId: repairFeedsSubWorkflowStep
    steps:
      - stepId: login
        operationId: getInventory
        outputs:
          token: $response.body#/token
      - stepId: call
        workflowId: echoValue
        parameters:
          - name: value
            value: $steps.login.outputs.token
        successCriteria:
          - condition: $workflows.echoValue.outputs.echoed == 'B'
        onFailure:
          - name: reLogin
            type: retry
            retryLimit: 1
            stepId: login
    outputs:
      echoed: $workflows.echoValue.outputs.echoed

  # a self-reference with a retryAfter delay, so a test can abort during the
  # wait and assert the reference itself never ran.
  - workflowId: retryWithReferenceDelay
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 2
            retryAfter: 3
            stepId: doomed

  # the step declares no onFailure, so it inherits the workflow-level
  # failureActions (end). Driven by a 500 so the step fails.
  - workflowId: inheritsFailureActions
    failureActions:
      - name: stopOnFailure
        type: end
    steps:
      - stepId: only
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $statusCode
      - stepId: unreached
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode

  # the step's own onFailure (break-by-omission: a goto to a later step)
  # overrides the workflow-level failureActions wholesale — the workflow's
  # "end" is not applied. Driven by a 500 so the step fails.
  - workflowId: overridesFailureActions
    failureActions:
      - name: stopOnFailure
        type: end
    steps:
      - stepId: failing
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: recover
            type: goto
            stepId: recovery
      - stepId: recovery
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          recovered: $statusCode

  # the workflow declares successActions (end after the first step); the step
  # declares no onSuccess, so it inherits them and the run ends early.
  - workflowId: inheritsSuccessActions
    successActions:
      - name: stopOnSuccess
        type: end
    steps:
      - stepId: first
        operationId: getInventory
        outputs:
          firstStatus: $statusCode
      - stepId: second
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          secondStatus: $statusCode
    outputs:
      first: $steps.first.outputs.firstStatus
      second: $steps.second.outputs.secondStatus

  # the first step declares an EMPTY onSuccess list, which overrides (suppresses)
  # the workflow-level successActions wholesale — the workflow "end" must NOT
  # apply, so the run proceeds to the second step rather than ending early.
  - workflowId: emptyOnSuccessSuppressesDefault
    successActions:
      - name: stopOnSuccess
        type: end
    steps:
      - stepId: first
        operationId: getInventory
        onSuccess: []
        outputs:
          firstStatus: $statusCode
      # also suppresses the default, so the run completes instead of the last
      # step re-triggering the inherited end.
      - stepId: second
        operationId: findPetsByStatus
        onSuccess: []
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          secondStatus: $statusCode
    outputs:
      first: $steps.first.outputs.firstStatus
      second: $steps.second.outputs.secondStatus

  # the step overrides onSuccess (goto) but declares no onFailure, so success and
  # failure fall back independently: on success the step's own goto wins; the
  # workflow-level failureActions remain available to it. Driven by a 200 so the
  # success path (goto) is exercised, skipping the middle step.
  - workflowId: overrideSuccessInheritFailure
    failureActions:
      - name: stopOnFailure
        type: end
    steps:
      - stepId: first
        operationId: getInventory
        onSuccess:
          - name: jump
            type: goto
            stepId: third
        outputs:
          firstStatus: $statusCode
      - stepId: second
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          secondStatus: $statusCode
      - stepId: third
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"
        outputs:
          thirdStatus: $statusCode
    outputs:
      second: $steps.second.outputs.secondStatus
      third: $steps.third.outputs.thirdStatus

  # both steps inherit the *same* workflow-level retry action element, having
  # declared no onFailure of their own. Retry budgets are keyed by action
  # element, so sharing one instance must not mean sharing one budget.
  - workflowId: inheritedRetryPerStepBudget
    failureActions:
      - name: retryOnce
        type: retry
        retryLimit: 1
    steps:
      - stepId: first
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          firstStatus: $statusCode
      - stepId: second
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          secondStatus: $statusCode
    outputs:
      first: $steps.first.outputs.firstStatus
      second: $steps.second.outputs.secondStatus

  # the workflow's parameters are applicable to every step: the first inherits
  # `status` having declared none of its own, the second overrides it with its
  # own value.
  - workflowId: inheritsParameters
    parameters:
      - name: status
        in: query
        value: $inputs.status
    steps:
      - stepId: inherits
        operationId: findPetsByStatus
      - stepId: overrides
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: sold

  # the workflow-level parameter is a runtime expression reading an earlier
  # step's output, so it can only be resolved per step, as each step is entered.
  - workflowId: parameterResolvedPerStep
    parameters:
      - name: petId
        in: path
        value: $steps.findPets.outputs.petId
    steps:
      - stepId: findPets
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          petId: $response.body#/id
      - stepId: getPet
        operationId: getPetById

  # a goto action naming neither stepId nor workflowId — malformed control flow.
  - workflowId: gotoNoTarget
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: bad
            type: goto

  # an action with an unknown type — malformed input, not a defined control flow.
  - workflowId: unknownActionType
    steps:
      - stepId: only
        operationId: getInventory
        onSuccess:
          - name: bogus
            type: teleport

  # a workflow with no steps at all — a completed, no-op run.
  - workflowId: emptyWorkflow
    steps: []

  # a present but non-list "steps" — malformed, an authoring error (not a no-op).
  - workflowId: scalarSteps
    steps: not-a-list

  # a present but non-list step `onSuccess` — malformed. Reported as a
  # ResolverError naming the field, not as a raw TypeError.
  - workflowId: malformedStepOnSuccess
    steps:
      - stepId: broken
        operationId: getInventory
        onSuccess: not-a-list
