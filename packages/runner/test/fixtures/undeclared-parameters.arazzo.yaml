arazzo: 1.0.1
info:
  title: Undeclared step parameters
  description: A token from one step travels to the next in parameters its operation does not declare.
  version: 1.0.0
sourceDescriptions:
  - name: petStore
    url: ./petstore.openapi-undeclared-parameters.json
    type: openapi
workflows:
  - workflowId: tokenThenCall
    parameters:
      - name: X-Client
        in: header
        value: arazzo-runner
    steps:
      - stepId: login
        operationId: listPets
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          token: $response.body#/name
      - stepId: getPet
        operationId: getPet
        parameters:
          - name: petId
            in: path
            value: 7
          - name: Authorization
            in: header
            value: $steps.login.outputs.token
          - name: tracking
            in: cookie
            value: a b;c
        successCriteria:
          - condition: $statusCode == 200
