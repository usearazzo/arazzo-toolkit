arazzo: "1.0.1"
info:
  title: Workflow composition test workflows
  version: "1.0.0"
  summary: >-
    Minimal workflows exercising WorkflowExecutor composition — sub-workflow
    (workflowId) steps and dependsOn prerequisites, with their cycle, depth and
    memoization edge cases — against the petstore API.
sourceDescriptions:
  - name: petstoreAPI
    url: ./petstore.openapi.json
    type: openapi
workflows:
  # a child workflow taking an input and producing an output — the callee in the
  # sub-workflow cases below.
  - workflowId: fetchPet
    inputs:
      type: object
      properties:
        petId:
          type: string
    steps:
      - stepId: get
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: $inputs.petId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petName: $response.body#/name
    outputs:
      name: $steps.get.outputs.petName

  # a step calls the child, mapping a parameter in (by name, no `in`) and the
  # child's output back out; a following step proves control returns.
  - workflowId: callsChild
    steps:
      - stepId: child
        workflowId: fetchPet
        parameters:
          - name: petId
            value: "7"
        outputs:
          childName: $workflows.fetchPet.outputs.name
      - stepId: after
        operationId: getInventory
        outputs:
          ran: $statusCode
    outputs:
      childName: $steps.child.outputs.childName
      afterRan: $steps.after.outputs.ran
      viaWorkflows: $workflows.fetchPet.outputs.name

  # two steps call the SAME child with different inputs — two distinct runs, so
  # neither trace may overwrite the other.
  - workflowId: callsChildTwice
    steps:
      - stepId: first
        workflowId: fetchPet
        parameters:
          - name: petId
            value: "7"
      - stepId: second
        workflowId: fetchPet
        parameters:
          - name: petId
            value: "8"

  # a child that always fails its criteria (driven by a 500 response).
  - workflowId: failingChild
    steps:
      - stepId: doomed
        operationId: getInventory
        successCriteria:
          - condition: $statusCode == 200

  # a failing sub-workflow takes the step's failure path: the retry re-runs the
  # whole child, once per attempt.
  - workflowId: retriesChild
    steps:
      - stepId: child
        workflowId: failingChild
        onFailure:
          - name: tryAgain
            type: retry
            retryLimit: 2
            retryAfter: 1

  # a workflow whose only step calls itself — a direct cycle.
  - workflowId: selfCycle
    steps:
      - stepId: again
        workflowId: selfCycle

  # an indirect cycle through sub-workflow steps: A -> B -> A.
  - workflowId: cycleA
    steps:
      - stepId: toB
        workflowId: cycleB
  - workflowId: cycleB
    steps:
      - stepId: toA
        workflowId: cycleA

  # a diamond: the top calls left and right, both of which call the same shared
  # workflow. Not a cycle — each visit completes and unwinds before the next.
  - workflowId: diamondTop
    steps:
      - stepId: left
        workflowId: diamondLeft
      - stepId: right
        workflowId: diamondRight
  - workflowId: diamondLeft
    steps:
      - stepId: shared
        workflowId: diamondShared
  - workflowId: diamondRight
    steps:
      - stepId: shared
        workflowId: diamondShared
  - workflowId: diamondShared
    steps:
      - stepId: only
        operationId: getInventory

  # legitimate acyclic nesting, three workflows deep — bounded by maxWorkflowDepth.
  - workflowId: deepOne
    steps:
      - stepId: down
        workflowId: deepTwo
  - workflowId: deepTwo
    steps:
      - stepId: down
        workflowId: deepThree
  - workflowId: deepThree
    steps:
      - stepId: only
        operationId: getInventory

  # two independent setup workflows used as prerequisites below.
  - workflowId: setupA
    steps:
      - stepId: only
        operationId: getInventory
        outputs:
          ran: $statusCode
    outputs:
      ran: $steps.only.outputs.ran
  - workflowId: setupB
    steps:
      - stepId: only
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: available
        outputs:
          ran: $statusCode
    outputs:
      ran: $steps.only.outputs.ran

  # both prerequisites run to completion, in declaration order, before this
  # workflow's own step; a dependency's outputs are readable via $workflows.
  - workflowId: dependent
    dependsOn:
      - setupA
      - setupB
    steps:
      - stepId: own
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"
        outputs:
          ran: $statusCode
    outputs:
      own: $steps.own.outputs.ran
      fromSetupA: $workflows.setupA.outputs.ran

  # a prerequisite that needs inputs — it has no spec-defined way to receive
  # them, so they come from the caller's dependencyInputs map.
  - workflowId: needsInput
    inputs:
      type: object
      properties:
        petId:
          type: string
    steps:
      - stepId: get
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: $inputs.petId
  - workflowId: dependsOnNeedsInput
    dependsOn:
      - needsInput
    steps:
      - stepId: own
        operationId: getInventory

  # a transitive prerequisite: outer -> middle -> needsInput.
  - workflowId: transitiveOuter
    dependsOn:
      - transitiveMiddle
    steps:
      - stepId: own
        operationId: getInventory
  - workflowId: transitiveMiddle
    dependsOn:
      - needsInput
    steps:
      - stepId: own
        operationId: getInventory

  # a dependency diamond: both prerequisites declare the same one, which must be
  # satisfied once rather than run twice.
  - workflowId: depDiamondTop
    dependsOn:
      - depDiamondLeft
      - depDiamondRight
    steps:
      - stepId: own
        operationId: getInventory
  - workflowId: depDiamondLeft
    dependsOn:
      - setupA
    steps:
      - stepId: own
        operationId: getInventory
  - workflowId: depDiamondRight
    dependsOn:
      - setupA
    steps:
      - stepId: own
        operationId: getInventory

  # a prerequisite that fails: the dependent cannot be processed and none of its
  # own steps run.
  - workflowId: dependsOnFailing
    dependsOn:
      - failingChild
    steps:
      - stepId: never
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: "7"

  # a cycle formed purely by dependsOn edges.
  - workflowId: depCycleA
    dependsOn:
      - depCycleB
    steps:
      - stepId: only
        operationId: getInventory
  - workflowId: depCycleB
    dependsOn:
      - depCycleA
    steps:
      - stepId: only
        operationId: getInventory

  # a cycle crossing both mechanisms: A dependsOn B, and B has a step calling A.
  - workflowId: crossA
    dependsOn:
      - crossB
    steps:
      - stepId: only
        operationId: getInventory
  - workflowId: crossB
    steps:
      - stepId: backToA
        workflowId: crossA

  # a sub-workflow step referencing another document — not yet supported.
  - workflowId: crossDocumentStep
    steps:
      - stepId: remote
        workflowId: $sourceDescriptions.petstoreAPI.someWorkflow

  # a prerequisite in another document — not yet supported.
  - workflowId: crossDocumentDependsOn
    dependsOn:
      - $sourceDescriptions.petstoreAPI.someWorkflow
    steps:
      - stepId: only
        operationId: getInventory

  # a step naming both a workflowId and an operationId — mutually exclusive.
  - workflowId: ambiguousStep
    steps:
      - stepId: both
        workflowId: fetchPet
        operationId: getInventory

  # a present but non-list "dependsOn" — malformed, an authoring error.
  - workflowId: scalarDependsOn
    dependsOn: setupA
    steps:
      - stepId: only
        operationId: getInventory
