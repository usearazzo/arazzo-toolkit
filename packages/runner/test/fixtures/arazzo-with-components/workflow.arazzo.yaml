arazzo: "1.0.1"
info:
  title: Test Workflow with Components
  version: "1.0.0"
sourceDescriptions:
  - name: testAPI
    url: ../petstore.openapi.json
    type: openapi
workflows:
  - workflowId: testWorkflow
    summary: Test workflow using component references
    successActions:
      - reference: $components.successActions.finish
    steps:
      - stepId: getPet
        operationId: getPetById
        parameters:
          - reference: $components.parameters.petId
  - workflowId: mergeReferencedActions
    summary: A step action overrides a referenced workflow action by its dereferenced name
    successActions:
      - reference: $components.successActions.finish
      - name: alsoEnd
        type: end
    steps:
      - stepId: getPet
        operationId: getPetById
        parameters:
          - reference: $components.parameters.petId
        onSuccess:
          - name: finish
            type: goto
            stepId: getPet
components:
  parameters:
    petId:
      name: petId
      in: path
      value: "123"
  successActions:
    finish:
      name: finish
      type: end
