arazzo: 1.0.1
info:
  title: Pet adoption
  version: 1.0.0
sourceDescriptions:
  - name: petstoreAPI
    url: ./petstore.openapi.json
    type: openapi
workflows:
  - workflowId: findPet
    steps:
      - stepId: getPet
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: 1
        successCriteria:
          - condition: $statusCode == 200
